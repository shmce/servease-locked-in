name: Migration drift

on:
  pull_request:
    paths:
      - 'backend/database/**'
      - 'backend/scripts/check-migration-drift.mjs'
      - 'backend/scripts/smoke-messaging.mjs'
      - '.github/workflows/migration-drift.yml'
  push:
    branches: [main]
    paths:
      - 'backend/database/**'
      - 'backend/scripts/check-migration-drift.mjs'
      - 'backend/scripts/smoke-messaging.mjs'

jobs:
  drift:
    name: Detect unapplied migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Check migration drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:migrations

      - name: Messaging smoke (RPC contract)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run smoke:messaging
